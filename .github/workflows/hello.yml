name: Qlib csi300 Top20 Low Turnover

on: workflow_dispatch

jobs:
  run-qlib:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Qlib
        run: |
          python -m pip install --upgrade pip
          pip install pyqlib

      - name: Clone Qlib Source
        run: |
          git clone --depth 1 https://github.com/microsoft/qlib.git /tmp/qlib_src

      - name: Download Qlib Data
        run: |
          cd /tmp/qlib_src
          python scripts/get_data.py qlib_data \
            --target_dir ~/.qlib/qlib_data/cn_data \
            --region cn \
            --interval 1d

      - name: Run csi300 Top20 Low Turnover
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          cd /tmp/qlib_src
          sed -i 's/topk: 50/topk: 20/' examples/benchmarks/LightGBM/workflow_config_lightgbm_Alpha158.yaml
          sed -i 's/n_drop: 5/n_drop: 2/' examples/benchmarks/LightGBM/workflow_config_lightgbm_Alpha158.yaml
          qrun examples/benchmarks/LightGBM/workflow_config_lightgbm_Alpha158.yaml