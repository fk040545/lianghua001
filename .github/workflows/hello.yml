name: Small Cap Weekly Top5 via AKShare

on: workflow_dispatch

jobs:
  run-smallcap:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install AKShare
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      - name: Run Small Cap Weekly Top5
        run: |
          cat > /tmp/smallcap_ak.py << 'EOF'
          import akshare as ak
          import pandas as pd

          # 1. 获取全市场A股实时行情（含总市值）
          print("正在获取全市场A股数据...")
          df = ak.stock_zh_a_spot_em()
          print(f"原始数据量: {len(df)}")

          # 2. 剔除ST股
          df = df[~df['名称'].str.contains('ST', na=False)]
          print(f"剔除ST后: {len(df)}")

          # 3. 剔除退市、停牌（可选）
          df = df[df['总市值'].notna()]
          df = df[df['总市值'] > 0]
          print(f"剔除无效市值后: {len(df)}")

          # 4. 按总市值升序排序，选最小的5只
          df_sorted = df.sort_values('总市值', ascending=True)
          top5 = df_sorted.head(5)

          # 5. 输出结果
          print("\n=== 本周小市值 Top5 ===")
          print(top5[['代码', '名称', '最新价', '总市值']].to_string(index=False))

          # 6. 保存结果
          top5.to_csv('/tmp/smallcap_top5.csv', index=False)
          print("\n结果已保存到 /tmp/smallcap_top5.csv")
          EOF
          python /tmp/smallcap_ak.py