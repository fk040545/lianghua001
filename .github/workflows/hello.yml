name: Test Qlib Install

on: workflow_dispatch

jobs:
  install-qlib:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Qlib
        run: |
          python -m pip install --upgrade pip
          pip install pyqlib

      - name: Verify Qlib
        run: |
          python -c "import qlib; print('Qlib installed successfully!')"