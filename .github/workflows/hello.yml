name: Qlib LightGBM Top10 All Market

on: workflow_dispatch

jobs:
  run-qlib:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Qlib
        run: |
          python -m pip install --upgrade pip
          pip install pyqlib

      - name: Clone Qlib Source
        run: |
          git clone --depth 1 https://github.com/microsoft/qlib.git /tmp/qlib_src

      - name: Download Qlib Data
        run: |
          cd /tmp/qlib_src
          python scripts/get_data.py qlib_data \
            --target_dir ~/.qlib/qlib_data/cn_data \
            --region cn \
            --interval 1d

      - name: Run LightGBM Workflow
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          cd /tmp/qlib_src
          python -c "
          import yaml
          with open('examples/benchmarks/LightGBM/workflow_config_lightgbm_Alpha158.yaml') as f:
              cfg = yaml.safe_load(f)
          cfg['market'] = 'all'
          cfg['strategy']['kwargs']['topk'] = 10
          cfg['strategy']['kwargs']['n_drop'] = 5
          with open('workflow_config_lightgbm_Alpha158_top10.yaml', 'w') as f:
              yaml.dump(cfg, f)
          "
          qrun workflow_config_lightgbm_Alpha158_top10.yaml