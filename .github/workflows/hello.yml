name: Qlib Download Data

on: workflow_dispatch

jobs:
  download-data:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Qlib
        run: |
          python -m pip install --upgrade pip
          pip install pyqlib

      - name: Download Qlib Data
        run: |
          python -m qlib.run.get_data qlib_data \
            --target_dir ~/.qlib/qlib_data/cn_data \
            --region cn \
            --interval 1d

      - name: Check Data
        run: |
          ls -lh ~/.qlib/qlib_data/cn_data